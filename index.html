<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Disable native scroll restoration before the browser lays out the
         document. Doing this inside React is too late on a hard reload: the
         browser can restore the old position while lazy route chunks load. -->
    <script>
      (() => {
        if ("scrollRestoration" in window.history) {
          window.history.scrollRestoration = "manual";
        }

        let keepInitialScrollAtTop = true;
        const releaseInitialScroll = () => {
          keepInitialScrollAtTop = false;
          window.__ISRA_INITIAL_SCROLL_RELEASED__ = true;
          window.removeEventListener("scroll", resetInitialScroll);
          window.removeEventListener("pageshow", resetInitialScroll);
        };
        const resetInitialScroll = () => {
          if (!keepInitialScrollAtTop || window.location.hash) return;
          if (window.scrollX !== 0 || window.scrollY !== 0) {
            window.scrollTo({ top: 0, left: 0, behavior: "auto" });
          }
        };

        // Native restoration emits scroll. Correct only an actual movement;
        // repeated layout-time writes during parsing and load are unnecessary.
        // Reader input releases this guard before its own scroll event.
        ["wheel", "touchstart", "pointerdown", "keydown"].forEach((type) =>
          window.addEventListener(type, releaseInitialScroll, { passive: true, once: true }),
        );
        window.addEventListener("scroll", resetInitialScroll, { passive: true });
        window.addEventListener("pageshow", resetInitialScroll);
        window.setTimeout(releaseInitialScroll, 8000);
      })();
    </script>
    <!-- Pinch-zoom and double-tap-zoom are intentionally left enabled —
         locking them site-wide is a real accessibility regression (WCAG
         1.4.4 Resize Text) for anyone who needs to zoom to read. Accidental
         double-tap-zoom on buttons/links is handled per-element instead via
         `touch-action: manipulation` (see the mobile perf pass in
         landing.css), which is the targeted fix without taking zoom away
         from the rest of the page. `viewport-fit=cover` keeps safe-area
         insets working for notched devices. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Isra Anwar is a digital consulting studio for web development, SEO, AI workflow, and content strategy."
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <!-- Google Search Console ownership verification. Persistent — don't
         remove even after GSC confirms; Google occasionally re-verifies. -->
    <meta name="google-site-verification" content="UJTNUNBhPjrvQm-Dsgpd-LqWwDq3x-egnE2fhYlUlEs" />
    <!-- Theme color per color-scheme so the mobile browser chrome matches the
         page. Dark comes first because that is the site's canonical look. -->
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark" />
    <!-- iOS mobile web-app polish: standalone display + status-bar styling
         when the user adds the site to Home Screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Isra Anwar" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Isra Anwar" />
    <meta property="og:title" content="Isra Anwar" />
    <meta
      property="og:description"
      content="Digital consulting for web development, SEO, AI workflow, and content strategy."
    />
    <meta property="og:url" content="https://www.israanwar.com/" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Isra Anwar" />
    <meta
      name="twitter:description"
      content="Digital consulting for web development, SEO, AI workflow, and content strategy."
    />

    <link rel="apple-touch-icon" href="/assets/brand/favicon-ia-v2.png?v=20260916-ia-v2-black-badge" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Archivo Black and Poppins use the same WOFF2 files, now served
         locally by brand-fonts.css alongside the application stylesheet. -->

      crossorigin="anonymous"
    ></script>
